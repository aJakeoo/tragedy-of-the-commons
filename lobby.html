<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobby - Tragedy of the Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mascot-pair" aria-hidden="true">
    <div class="mascot mascot-happy"><span class="mascot-mouth"></span></div>
    <div class="mascot mascot-grumpy"><span class="mascot-mouth"></span></div>
  </div>
  <h1 id="game-title">Lobby</h1>

  <div class="room-code" id="room-code">----</div>
  <p class="muted" style="text-align:center">Share this code with everyone playing.</p>

  <div class="card qr-wrap">
    <img id="join-qr" alt="QR code to join this room" width="160" height="160">
    <p class="muted qr-caption">Or scan to join</p>
  </div>

  <div class="card">
    <h2>Players</h2>
    <ul class="player-list" id="player-list"></ul>
  </div>

  <div id="mode-controls" class="card hidden">
    <h2>Play mode</h2>
    <div class="mode-options">
      <button type="button" class="mode-option" id="mode-funniest" data-mode="funniest">
        <strong>Vote funniest</strong>
        <span class="muted">Everyone rates the clips with points - most points wins.</span>
      </button>
      <button type="button" class="mode-option" id="mode-guess" data-mode="guess">
        <strong>Guess who submitted</strong>
        <span class="muted">Everyone guesses who posted each clip - most correct guesses wins.</span>
      </button>
    </div>
  </div>

  <!-- Where the compiled reel actually plays. Host-only and lobby-only, same
       as the play mode above - see PLAYBACK_* in js/config.js. -->
  <div id="playback-controls" class="card hidden">
    <h2>Where it plays</h2>
    <div class="mode-options">
      <button type="button" class="mode-option" id="playback-cast" data-playback="cast">
        <strong>Cast to the TV</strong>
        <span class="muted">The reel plays on your screen only - everyone watches that and uses their phone to guess, vote and skip.</span>
      </button>
      <button type="button" class="mode-option" id="playback-synced" data-playback="synced">
        <strong>Everyone's own device, in sync</strong>
        <span class="muted">The same reel plays on every phone, kept in step with yours. You still drive - swipe to move the room on. Best with uploaded clips.</span>
      </button>
    </div>
  </div>

  <div id="host-controls" class="card hidden">
    <button class="primary" id="start-btn">Start game</button>
    <p class="muted" id="start-hint"></p>
  </div>

  <div id="guest-controls" class="card hidden">
    <p class="muted">Waiting for the host to start the game&hellip;</p>
    <p class="muted" id="guest-mode-label"></p>
    <p class="muted" id="guest-playback-label"></p>
  </div>

  <p class="error hidden" id="lobby-error"></p>

  <footer class="build-note">Tragedy of the Commons</footer>

  <script type="module" src="js/lobby.js"></script>
</body>
</html>
